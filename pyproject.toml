[project]
name = "expenso"
authors = [
    { name = "Arun Joy Thekkiniyath", email = "contact22logic@gmail.com"}
]
description = "A family expense tracker where multiple household members share and record expenses"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    # frappe-mcp 0.1.0 on PyPI hard-pins Werkzeug==3.1.3/pydantic~=2.11.7, which
    # conflicts with Frappe v16's own Werkzeug==3.1.6/pydantic~=2.12.5 pins and makes
    # `uv` refuse to resolve on a fresh build (#86). Pinned to a commit on an unmerged
    # upstream fix (frappe/mcp#5) that only widens those two ranges — swap back to
    # "frappe-mcp~=0.1.0" (or a newer PyPI release) once that PR ships upstream.
    "frappe-mcp @ git+https://github.com/newmatik/mcp.git@9a60d1814472a07d47fc33f89a145c74a26cfd7c",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
